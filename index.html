<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDI 掃地排班系統 - 入口門戶</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/index.css">
</head>

<body class="portal-a">

    <header>
        <p>MDI CLEANING MANAGEMENT <span class="app-version" style="opacity:0.6; font-size:0.75rem; margin-left:8px;"></span></p>
        <h1>排班系統入口</h1>
    </header>

    <div class="portal-grid">
        <!-- 一般打掃人員入口 -->
        <a href="frontend/viewer.html" class="portal-card">
            <div class="icon-box">🧹</div>
            <h2>一般打掃人員</h2>
            <p>查看今日負責區域<br>並完成線上掃地確認</p>
        </a>

        <!-- 責任者入口 -->
        <a href="frontend/setup.html" class="portal-card">
            <span class="badge">ADMIN</span>
            <div class="icon-box">🛠️</div>
            <h2>今週の朝掃除責任者</h2>
            <p>管理打掃區域、安排人員排班<br>以及系統進階設定</p>
            <p id="plannerInfo"
                style="margin-top:16px;font-size:0.85rem;color:#a78bfa;font-weight:600;position:relative;z-index:1;">
            </p>
        </a>
    </div>

    <script>
        (async () => {
            try {
                // 1. 讀取 data.json 取得 GAS_API_URL
                const dataRes = await fetch('data/data.json?v=' + Date.now(), { cache: 'no-store' });
                const localData = await dataRes.json();
                const GAS_URL = localData.gasApiUrl || '';

                // 輪值推算公式（與 setup.html 一致）
                function calcPlannerName(rot, staffList) {
                    if (!rot || !rot.planners || rot.planners.length === 0) return '';
                    let idx = rot.baseIndex !== undefined ? rot.baseIndex : (rot.currentIndex || 0);
                    if (rot.baseDate) {
                        const base = new Date(rot.baseDate);
                        base.setHours(0, 0, 0, 0);
                        const today = new Date();
                        today.setHours(0, 0, 0, 0);
                        const diffWeeks = Math.floor((today.getTime() - base.getTime()) / (1000 * 60 * 60 * 24 * 7));
                        idx = ((idx + diffWeeks) % rot.planners.length + rot.planners.length) % rot.planners.length;
                    } else {
                        idx = idx % rot.planners.length;
                    }
                    const pId = rot.planners[idx];
                    const pStaff = (staffList || []).find(s => s.id === pId);
                    return pStaff ? pStaff.name : '';
                }

                // 2. 優先從雲端讀取 [PlannerRotation]
                let plannerName = '';
                let currentI1 = '';

                if (GAS_URL && !GAS_URL.includes('YOUR_GAS')) {
                    try {
                        const rotRes = await fetch(GAS_URL + '?type=rotation', { cache: 'no-store' });
                        const rotData = await rotRes.json();

                        if (!rotData.error && rotData.planners && rotData.planners.length > 0) {
                            // 用雲端資料推算
                            const cloudRot = {
                                planners: rotData.planners,
                                baseDate: rotData.baseDate,
                                baseIndex: rotData.baseIndex,
                            };
                            const cloudStaff = Object.entries(rotData.staffNames || {}).map(([id, name]) => ({ id, name }));
                            plannerName = calcPlannerName(cloudRot, cloudStaff);
                            currentI1 = rotData.currentI1 || '';
                        }
                    } catch (e) {
                        console.warn('[index.html] 無法從雲端讀取輪值設定，退回本地計算');
                    }
                }

                // 3. Fallback：若雲端無資料，讀取 data.json 本地推算
                if (!plannerName) {
                    plannerName = calcPlannerName(localData.plannerRotation, localData.staff);
                }

                // 4. 顯示今日責任者
                if (plannerName) {
                    document.getElementById('plannerInfo').textContent = '📋 今日責任者：' + plannerName;
                }

                // 5. 比對 I1，若不同則回寫（fire-and-forget）
                if (plannerName && currentI1 !== plannerName && GAS_URL && !GAS_URL.includes('YOUR_GAS')) {
                    fetch(GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ type: 'updateI1', plannerName: plannerName }),
                    }).catch(err => console.warn('[index.html] 更新 I1 失敗:', err));
                }

            } catch (e) {
                console.warn('無法讀取今日責任者:', e);
            }
        })();
    </script>

</body>

</html>
